name: ds-tt-base-py39

channels:
  - conda-forge

dependencies:
  # Python / environment tooling
  - python=3.9.23

  # Core DS
  - numpy=1.21.2
  - pandas=1.2.4
  - scipy=1.10.1
  - scikit-learn=0.24.1
  - joblib=1.5.0
  - lightgbm=3.3.1
  - catboost=1.0.3
  - typing-extensions=4.2.0

  # Visualization
  - matplotlib=3.3.4
  - seaborn=0.11.1

  # Notebook kernel
  - ipykernel=6.29.5
